<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="g1" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#0a3a5c"/>
      <stop offset="60%" stop-color="#051e36"/>
      <stop offset="100%" stop-color="#020d1a"/>
    </radialGradient>
    <radialGradient id="g2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0d4060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g3" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#083050" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Deep ocean background -->
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <!-- Caustic light rays -->
  <g opacity="0.06" filter="url(#blur1)">
    <path d="M800 0 Q850 300 750 600 Q700 900 720 1080" stroke="#00e5ff" stroke-width="80" fill="none"/>
    <path d="M1100 0 Q1050 250 1150 500 Q1200 750 1180 1080" stroke="#00b8d4" stroke-width="60" fill="none"/>
    <path d="M400 0 Q450 200 380 450 Q330 700 360 1080" stroke="#00e5ff" stroke-width="50" fill="none"/>
    <path d="M1500 0 Q1480 300 1550 600 Q1600 850 1570 1080" stroke="#00c8e0" stroke-width="45" fill="none"/>
  </g>
  <!-- Bioluminescent particles -->
  <g filter="url(#glow)" opacity="0.7">
    <circle cx="200" cy="150" r="2" fill="#00e5ff"/>
    <circle cx="450" cy="320" r="1.5" fill="#00e5ff"/>
    <circle cx="780" cy="200" r="2.5" fill="#00bcd4"/>
    <circle cx="1100" cy="450" r="2" fill="#00e5ff"/>
    <circle cx="1400" cy="180" r="1.5" fill="#00e5ff"/>
    <circle cx="1650" cy="380" r="2" fill="#00bcd4"/>
    <circle cx="320" cy="580" r="1.5" fill="#00e5ff"/>
    <circle cx="900" cy="620" r="2" fill="#00e5ff"/>
    <circle cx="1250" cy="700" r="1.5" fill="#40ffaa"/>
    <circle cx="600" cy="800" r="2" fill="#00e5ff"/>
    <circle cx="1700" cy="650" r="2.5" fill="#00e5ff"/>
    <circle cx="100" cy="750" r="1.5" fill="#40ffaa"/>
    <circle cx="1820" cy="200" r="2" fill="#ffd54f" opacity="0.5"/>
    <circle cx="80" cy="400" r="1.5" fill="#ffd54f" opacity="0.4"/>
  </g>
  <!-- Subtle seaweed/coral silhouettes at bottom -->
  <g opacity="0.12" fill="#00e5ff">
    <ellipse cx="100" cy="1050" rx="15" ry="40"/>
    <ellipse cx="160" cy="1060" rx="10" ry="30"/>
    <ellipse cx="1800" cy="1055" rx="12" ry="35"/>
    <ellipse cx="1860" cy="1065" rx="8" ry="25"/>
    <ellipse cx="960" cy="1058" rx="14" ry="38"/>
  </g>
</svg>